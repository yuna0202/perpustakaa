services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "Perpustakaan Universitas Gajayana Malang"
      APP_ENV: production
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
      MEMBERSHIP_VERIFICATION_BASE_URL: "${MEMBERSHIP_VERIFICATION_BASE_URL:-http://localhost}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: perpustakaan_gajayana
      DB_USERNAME: perpustakaan
      DB_PASSWORD: "${DB_PASSWORD:-}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: perpustakaan_gajayana
      MYSQL_USER: perpustakaan
      MYSQL_PASSWORD: "${DB_PASSWORD:-}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  app_storage:
  mysql_data:
